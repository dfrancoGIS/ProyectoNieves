<div class="container">
  <h1 mat-dialog-title>Nueva Activación</h1>
  <mat-divider></mat-divider>

  <div mat-dialog-content>
    <form [formGroup]="shiftForm">
      
      <!-- Fecha de activación -->
      <mat-form-field appearance="outline">
        <mat-label>Fecha de activación</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fecha" [min]="minDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <!-- Hora de inicio -->
      <mat-form-field appearance="outline">
        <mat-label>Hora de inicio</mat-label>
        <input matInput type="time" formControlName="hora">
      </mat-form-field>

      <!-- Activado por -->
      <mat-form-field appearance="outline">
        <mat-label>Activado por</mat-label>
        <mat-select formControlName="activadoPor">
          <mat-option *ngFor="let option of activadoPorOptions" [value]="option">{{ option }}</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Empresa del recurso -->
      <mat-form-field appearance="outline">
        <mat-label>Empresa del recurso</mat-label>
        <mat-select formControlName="empresaRecurso" (selectionChange)="onEmpresaChange($event.value)">
          <mat-option *ngFor="let empresa of empresasRecurso" [value]="empresa">{{ empresa }}</mat-option>
        </mat-select>
      </mat-form-field>

<!-- Recurso seleccionado -->
<mat-form-field appearance="outline">
  <mat-label>Recurso seleccionado</mat-label>
  <mat-select formControlName="recurso" (selectionChange)="onRecursoChange($event.value)">
    <mat-option *ngFor="let recurso of recursosDisponibles" [value]="recurso">{{ recurso }}</mat-option>
  </mat-select>
</mat-form-field>

      <!-- Vehículo asignado -->
      <mat-form-field appearance="outline">
        <mat-label>Vehículo asignado</mat-label>
        <input type="text" matInput [matAutocomplete]="auto" formControlName="vehiculo">
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option *ngFor="let vehiculo of vehiculosDisponibles" [value]="vehiculo">
            {{ vehiculo }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <!-- Duración teórica del turno -->
      <mat-form-field appearance="outline">
        <mat-label>Duración del turno (horas)</mat-label>
        <input matInput type="number" formControlName="duracionTurno" min="1" max="24" step="0.5" required>
      </mat-form-field>
      

      
      <!-- Tipo de Turno -->
<mat-form-field appearance="outline">
  <mat-label>Tipo de turno</mat-label>
  <mat-select formControlName="tipoTurno">
    <mat-option value="Personal">Personal</mat-option>
    <mat-option value="Quitanieves">Quitanieves</mat-option>
  </mat-select>
</mat-form-field>

<!-- Número de Turno -->
<mat-form-field appearance="outline">
  <mat-label>Número de Turno</mat-label>
  <input matInput type="number" formControlName="numeroTurno" min="1">
</mat-form-field>

    </form>
  </div>

  <!-- Botón "Siguiente" para ir al siguiente formulario -->
  <mat-dialog-actions class="mat-mdc-dialog-actions">
    <button mat-raised-button color="warn" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" [disabled]="shiftForm.invalid" (click)="onNext()">Siguiente</button>
  </mat-dialog-actions>
</div>
